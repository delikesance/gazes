# Used with compose.yaml under the separate gazes-dev project.
services:
  backend:
    build:
      dockerfile: deploy/backend.dev.Dockerfile
    environment:
      APP_ENV: development
      # The dev stack shares the upstream cache and rate limits with production, but keeps its own auth state.
      REDIS_NAMESPACE: "${REDIS_NAMESPACE:-gazes-dev}"
    volumes:
      - .:/src:ro
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - dev-data:/app/data
      - dev-cache:/app/cache
      - dev-accounts:/app/accounts
      # Replaces the production /mnt/gazes bind (same target). The dev pool is empty: create a disk with
      #   docker compose -p gazes-dev exec backend sh -c 'mkdir -p /app/library-pool/dev && echo "{\"disk_id\":\"dev\"}" > /app/library-pool/dev/.gazes-library'
      - dev-library-pool:/app/library-pool
    healthcheck:
      start_period: 180s
  web:
    build:
      dockerfile: deploy/web.dev.Dockerfile
    volumes:
      - ./web:/app
      - web-modules:/app/node_modules
      - web-next:/app/.next
      - pnpm-store:/pnpm/store
    healthcheck:
      start_period: 180s

volumes:
  go-modules:
  go-build:
  dev-data:
  dev-cache:
  dev-accounts:
  dev-library-pool:
  web-modules:
  web-next:
  pnpm-store:
