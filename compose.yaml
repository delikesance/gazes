services:
  prowlarr-init:
    image: python:3.13-alpine
    network_mode: none
    volumes:
      - prowlarr-config:/config
      - ./deploy/prowlarr-bootstrap.py:/bootstrap.py:ro
    command: ["python", "/bootstrap.py", "init"]
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "10001"
      PGID: "10001"
      TZ: UTC
    volumes:
      - prowlarr-config:/config
    depends_on:
      prowlarr-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
  prowlarr-configure:
    image: python:3.13-alpine
    volumes:
      - prowlarr-config:/config:ro
      - indexer-secrets:/shared
      - ./deploy/prowlarr-bootstrap.py:/bootstrap.py:ro
    command: ["python", "/bootstrap.py", "configure"]
    depends_on:
      prowlarr:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8090"
      INDEXER_CONFIG_FILE: /run/gazes/indexers.json
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      LOG_DIR: /app/diagnostics
    volumes:
      - indexer-secrets:/run/gazes:ro
      - diagnostics:/app/diagnostics
    depends_on:
      prowlarr-configure:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
  web:
    environment:
      BACKEND_URL: http://backend:8090
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${GAZES_PORT:-8080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  prowlarr-config:
  indexer-secrets:
  diagnostics:
