services:
  prowlarr-init:
    image: python:3.13-alpine
    network_mode: none
    volumes:
      - prowlarr-config:/config
      - ./deploy/prowlarr-bootstrap.py:/bootstrap.py:ro
    command: ["python", "/bootstrap.py", "init"]
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "10001"
      PGID: "10001"
      TZ: UTC
    volumes:
      - prowlarr-config:/config
    depends_on:
      prowlarr-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: UTC
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8
  prowlarr-configure:
    image: python:3.13-alpine
    env_file:
      - path: .env
        required: false
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      - prowlarr-config:/config:ro
      - indexer-secrets:/shared
      - ./deploy/prowlarr-bootstrap.py:/bootstrap.py:ro
    command: ["python", "/bootstrap.py", "configure"]
    depends_on:
      prowlarr:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8090"
      INDEXER_CONFIG_FILE: /run/gazes/indexers.json
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      LOG_DIR: /app/diagnostics
      TORRENT_PORT: "${TORRENT_PORT:-42069}"
      ACCOUNTS_DIR: /app/accounts
      # Required: caches, upstream rate limits and auth state live in the shared Redis (make redis-up).
      REDIS_URL: "redis://:${REDIS_PASSWORD:-}@gazes-redis:6379/0"
      REDIS_NAMESPACE: "${REDIS_NAMESPACE:-gazes}"
      ANILIST_PER_MINUTE: "${ANILIST_PER_MINUTE:-24}"
      # The backend is only reachable through the web service, so its X-Forwarded-* headers are trusted.
      TRUST_PROXY: "true"
      # Required in production: run `make secrets` to generate them into .env.
      ACCOUNTS_ENC_KEY: "${ACCOUNTS_ENC_KEY:-}"
      ACCOUNTS_INDEX_KEY: "${ACCOUNTS_INDEX_KEY:-}"
      ACCOUNTS_PEPPER: "${ACCOUNTS_PEPPER:-}"
      ALTCHA_HMAC_KEY: "${ALTCHA_HMAC_KEY:-}"
      LIBRARY_POOL_DIR: /app/library-pool
      LIBRARY_INDEX_DIR: /app/library-index
    # Inbound peer connections (TCP + uTP/DHT). Forward the same port on your router for the best swarm reach.
    ports:
      - "${TORRENT_PORT:-42069}:${TORRENT_PORT:-42069}/tcp"
      - "${TORRENT_PORT:-42069}:${TORRENT_PORT:-42069}/udp"
    volumes:
      - indexer-secrets:/run/gazes:ro
      - diagnostics:/app/diagnostics
      - torrent-data:/app/data
      - torrent-cache:/app/cache
      - accounts:/app/accounts
      - library-index:/app/library-index
      # AV1 library pool: disks labelled GAZES* are mounted below /mnt/gazes by the host (make library-install-host).
      # rshared lets disks plugged in later appear without recreating the container. No `:z` relabel: the Docker
      # daemon runs without SELinux support. If Docker SELinux is ever enabled, the pool needs container_file_t
      # (mount option context=system_u:object_r:container_file_t:s0 for exfat/ntfs/vfat, chcon -R -t container_file_t for ext4).
      - type: bind
        source: /mnt/gazes
        target: /app/library-pool
        bind:
          propagation: rshared
          create_host_path: true
    networks: [default, gazes-shared]
    depends_on:
      prowlarr-configure:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
  web:
    environment:
      BACKEND_URL: http://backend:8090
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    init: true
    ports:
      # Loopback only: Caddy is the edge and sets X-Forwarded-For, which rate limits trust.
      - "127.0.0.1:${GAZES_PORT:-8080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Optional TLS edge: `docker compose --profile edge up -d` with GAZES_DOMAIN set.
  # Caddy 2.10+ (Go 1.24+) negotiates the hybrid post-quantum X25519MLKEM768 key exchange by default.
  edge:
    profiles: ["edge"]
    image: caddy:2
    restart: unless-stopped
    environment:
      GAZES_DOMAIN: "${GAZES_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

# Created by `make redis-up`; shared with the Redis of compose.redis.yaml.
networks:
  gazes-shared:
    external: true

volumes:
  prowlarr-config:
  indexer-secrets:
  diagnostics:
  torrent-data:
  torrent-cache:
  accounts:
  library-index:
  caddy-data:
  caddy-config:
