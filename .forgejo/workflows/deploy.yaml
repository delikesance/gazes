name: Deploy to production

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Build, vet, typecheck and test the exact commit before it reaches the host.
  # Steps live in deploy/ci-verify.sh so this job stays identical in every workflow.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@11.25.0
      - name: Verify
        env:
          # The Go suite still has known failures: report them without blocking.
          # Switch to "0" once it is green (see deploy/ci-verify.sh).
          GO_TEST_ADVISORY: "1"
        run: bash deploy/ci-verify.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and restart the stack
        env:
          # The runner shares the production host: 172.19.0.1 is the host as seen
          # from the forgejo_forgejo_net Docker network.
          DEPLOY_HOST: 172.19.0.1
          DEPLOY_USER: workstation
          DEPLOY_PORT: "22"
          DEPLOY_PATH: /home/workstation/Projects/gazes
          DEPLOY_SHA: ${{ github.sha }}
        # `make up` waits for every health check (compose --wait). If it fails, the
        # host goes back to the commit it was running before and the job stays red.
        run: |
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          deploy_path=$1 deploy_sha=$2
          cd "$deploy_path"
          prev_sha=$(git rev-parse HEAD)
          git fetch origin main
          git checkout --detach "$deploy_sha"
          if ! make up; then
            echo "Deploy of $deploy_sha failed; rolling back to $prev_sha" >&2
            git checkout --detach "$prev_sha"
            if make up; then
              echo "Rolled back to $prev_sha" >&2
            else
              echo "Rollback to $prev_sha failed too: the stack needs a manual look" >&2
            fi
            exit 1
          fi
          docker image prune -f
          REMOTE
